# TEMPORARY (step 20 acceptance): main with Google-hosted fonts vs this branch with self-hosted fonts.
# Reverted after the run; the screenshots are attached to the PR description.
name: font-compare

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: branch
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build both
        run: |
          for side in main branch; do
            (cd $side/frontend && npm ci && NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 npm run build)
          done
          grep -c "next/font/google" main/frontend/app/layout.tsx
          grep -c "next/font/local" branch/frontend/app/layout.tsx
          # the exact files next/font/google downloaded for main, with the @font-face CSS that names them
          mkdir -p google-fonts && cp main/frontend/.next/static/media/*.woff2 google-fonts/
          grep -l "font-face" main/frontend/.next/static/chunks/*.css main/frontend/.next/static/css/*.css 2>/dev/null | xargs -I{} cp {} google-fonts/ || true
          sha256sum google-fonts/*
      - name: Install Chromium
        working-directory: branch/frontend
        run: |
          npx playwright install --with-deps chromium
          # the compare config lives outside frontend/; let it resolve @playwright/test from there
          ln -s "$GITHUB_WORKSPACE/branch/frontend/node_modules" "$GITHUB_WORKSPACE/branch/.github/font-compare/node_modules"
      - name: Start both
        run: |
          (cd main/frontend && npx next start -p 3001 > ../../main.log 2>&1 &)
          (cd branch/frontend && npx next start -p 3002 > ../../branch.log 2>&1 &)
          for port in 3001 3002; do
            for i in $(seq 1 60); do curl -sf http://localhost:$port > /dev/null && break; sleep 1; done
          done
      - name: Reference screenshots from main (Google-hosted fonts)
        working-directory: branch/frontend
        run: >
          BASE_URL=http://localhost:3001 REPORT_DIR=$GITHUB_WORKSPACE/report-main OUTPUT_DIR=$GITHUB_WORKSPACE/results-main
          npx playwright test -c ../.github/font-compare/playwright.config.ts --update-snapshots
      - name: Same pages from this branch (self-hosted fonts) must be pixel-identical
        working-directory: branch/frontend
        run: >
          BASE_URL=http://localhost:3002 REPORT_DIR=$GITHUB_WORKSPACE/report-branch OUTPUT_DIR=$GITHUB_WORKSPACE/results-branch
          npx playwright test -c ../.github/font-compare/playwright.config.ts
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-compare
          path: |
            branch/.github/font-compare/snapshots
            results-branch
            report-branch
            google-fonts
          retention-days: 14
