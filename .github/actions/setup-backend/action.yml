name: Set up the backend
description: Python with pip caching, the backend dependencies pinned by requirements.lock, and optionally Tesseract.
inputs:
  tesseract:
    description: Install Tesseract OCR (apt) so the OCR tests run instead of skipping.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements.lock
    - name: Install Tesseract OCR
      if: inputs.tesseract == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
        tesseract --version | head -1
    - name: Install Python dependencies (pinned by requirements.lock)
      shell: bash
      run: |
        python --version
        python -m pip install --upgrade pip
        # torch from the CPU wheel index (no CUDA download); "torch==X" in the lock matches "X+cpu".
        python -m pip install "$(grep -E '^torch==' requirements.lock)" --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements.txt -c requirements.lock
        python -m pip check
